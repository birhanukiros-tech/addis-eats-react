<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Exerscic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
        <button id="themeToggle" aria-label="Toggle theme">
            🌙 Dark Mode
        </button>
    </div>

    <!-- Signup Form -->
    <div class="container">
        <h1>Signup Form</h1>
        
        <div class="stats">
            <p>Total Signups: <span id="signupCount">0</span></p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
                <small>Minimum 2 characters</small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="09XX XXX XXX" required>
                <small>Ethiopian phone format: 09XX XXX XXX</small>
            </div>

            <button type="submit">Sign Up</button>
            <div id="errorArea" class="error-area"></div>
        </form>
    </div>

    <script src="storage-helpers.js"></script>
    <script src="theme-toggle.js"></script>
    <script src="signup-form.js"></script>
</body>
</html>
