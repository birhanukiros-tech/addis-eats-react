<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch - ETB Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🇪🇹 Birr Watch</h1>
            <p class="subtitle">Live Ethiopian Birr Exchange Rates</p>
        </header>

        <!-- Status Line -->
        <div id="status" class="status">
            <span class="status-icon"></span>
            <span class="status-text">Loading exchange rates...</span>
        </div>

        <!-- Converter Section -->
        <section class="converter-section">
            <h2>Currency Converter</h2>
            <form id="convertForm" class="convert-form">
                <div class="form-group">
                    <label for="amount">Amount (ETB)</label>
                    <input 
                        type="text" 
                        id="amount" 
                        placeholder="Enter amount"
                        autocomplete="off"
                    >
                </div>
                <div class="form-group">
                    <label for="currencySelect">Target Currency</label>
                    <select id="currencySelect">
                        <option value="">Select currency...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Convert</button>
            </form>
            <div id="result" class="result"></div>
        </section>

        <!-- Watchlist Section -->
        <section class="watchlist-section">
            <div class="watchlist-header">
                <h2>⭐ Watchlist</h2>
                <span class="watchlist-count" id="watchlistCount">0 currencies</span>
            </div>
            
            <div class="add-watchlist">
            <label for="watchlistSelect">Watch</label>
                <select id="watchlistSelect">
                    <option value="">Add currency...</option>
                </select>
                <button id="addWatchlistBtn" class="btn btn-secondary">Add</button>
            </div>

            <ul id="watchlist" class="watchlist"></ul>
        </section>

        <!-- Footer -->
        <footer>
            <p>Rates updated: <span id="lastUpdated">Never</span></p>
            <p class="disclaimer">Data provided by Exchange Rate API</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
