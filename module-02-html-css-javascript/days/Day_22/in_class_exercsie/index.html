<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch - ETB Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🇪🇹 Birr Watch</h1>
            <p class="subtitle">Live Ethiopian Birr (ETB) Exchange Rates</p>
        </header>

        <!-- Status Line -->
        <div id="status" class="status loading">
            <span class="status-icon">⟳</span>
            <span class="status-text">Loading exchange rates...</span>
        </div>

        <!-- Main Content -->
        <main>
            <!-- Converter Section -->
            <section class="converter-section">
                <h2>Currency Converter</h2>
                <form id="convertForm" class="convert-form">
                    <div class="form-group">
                        <label for="amount">Amount (ETB)</label>
                        <input 
                            type="number" 
                            id="amount" 
                            placeholder="1000" 
                            min="0.01" 
                            step="0.01"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="currency">Target Currency</label>
                        <select id="currency" required>
                            <option value="">Select currency...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Convert</button>
                </form>
                <div id="conversionResult" class="conversion-result"></div>
            </section>

            <!-- Watchlist Section -->
            <section class="watchlist-section">
                <div class="watchlist-header">
                    <h2>⭐ Watchlist</h2>
                    <span class="watchlist-count" id="watchlistCount">0 currencies</span>
                </div>
                
                <!-- Add to Watchlist -->
                <div class="add-watchlist">
                    <select id="watchlistSelect">
                        <option value="">Add currency to watchlist...</option>
                    </select>
                    <button id="addWatchlistBtn" class="btn btn-secondary">Add</button>
                </div>

                <!-- Watchlist Display -->
                <div id="watchlistContainer" class="watchlist-container">
                    <p class="empty-message">No currencies in watchlist. Add your favorites!</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>Rates updated: <span id="lastUpdated">Loading...</span></p>
            <p class="disclaimer">Exchange rates are for informational purposes only.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="storage.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
