<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Habesha Eatery, Bole</title>
    <meta name="desicription" content="Get in touch with Habsha eatery in bole,Addis Ababa">
</head>
<body>
     <header>
        <h1>Contact Habesha Eatry</h1>
        <nav>
            <a href="index.html">Reservation</a><br>
            <a href="contact.html">contact</a>
        </nav>
    </header>
    <main>
        <section>
        <h2>Send Us a Direct Message</h2>
        <form action="contact" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message">Your Message:</label><br>
            <textarea name="message" id="message" rows="3" cols="30" required placeholder="Write your comment here..."></textarea><br><br>
            <button type="submit">Send Message</button>
        </form>
        </section>
        <section>
            <h2>Opninig Hours</h2>
            <table>
                <tr>
                    <th>Days</th> <th>Opening</th> <th>Closing</th>
                </tr>
                <tr>
                    <td>Monday</td> <td>6:00</td> <td>8:00</td>
                </tr>
                <tr>
                    <td>Tuesday</td> <td>5:30</td> <td>7:00</td>
                </tr>
                <tr>
                    <td>Wednsday</td> <td>6:00</td> <td>7:30</td>
                </tr>
                <tr>
                    <td>Tursday</td> <td>6:00</td> <td>7:00</td>
                </tr>
                <tr>
                    <td>Friday</td> <td>7:00</td> <td>8:00</td>
                </tr>
            </table>
        </section>
    </main>
    <footer><p>Bole, Addis Ababa | Call us: <a href="tel: 0911223344">0911223344</a>
    </p></footer>
</body>
</html>
